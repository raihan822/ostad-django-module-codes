<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Post Title</title>
</head>
<body>
    <h1>Post Titles</h1>
    <ul>
        {% for post in all_posts %}
            <li>{{post.title}} - {{post.content}} - {{post.create_date}}</li>
        {% endfor %}
    </ul>
</body>
</html>
